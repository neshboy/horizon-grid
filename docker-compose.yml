# Shared log-rotation config, referenced by every service below via YAML
# anchor. Real gap this closes: the app previously logged only to stdout
# with no rotation anywhere, and Docker's default json-file driver applies
# with NO size cap unless a service explicitly sets one -- confirmed live
# via `docker inspect ... --format '{{.HostConfig.LogConfig}}'` showing an
# empty options map on every service. Left unbounded, months of steady
# investigation volume (each one emits 10+ structured log lines) grows the
# per-container *-json.log file on the host without limit, up to and
# including filling the same disk Postgres's own data directory lives on --
# a silent way to take down the whole stack that has nothing to do with the
# application's own behavior. 10MB x 3 files = 30MB max per container,
# comfortably enough history for troubleshooting without being unbounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    # Resource limits: real gap this closes -- no CPU/memory limit existed
    # on any service, so a runaway task, a memory leak, or a burst of
    # concurrent investigations could consume unbounded host RAM/CPU and
    # starve or crash sibling containers with no backstop. These are
    # reasonable starting defaults for a single-site deployment, not a
    # precisely-tuned ceiling -- an administrator with real headroom to
    # spare, or a genuinely resource-constrained remote site, should adjust
    # them for their own hardware rather than treat these numbers as fixed.
    mem_limit: 1g
    # Mission-critical requirement: a crashed/OOM-killed datastore must come
    # back on its own, not stay down until a human notices. Confirmed live
    # this is real (not automatic): a plain `docker run` container with no
    # restart policy stayed Exited(137) indefinitely after a kill, while the
    # SAME container with restart:unless-stopped correctly self-restarted
    # after a genuine OOM-kill (RestartCount incremented, verified via
    # `docker inspect`). "unless-stopped" (not "always") deliberately still
    # respects an explicit `docker stop`/`docker compose stop` -- an operator
    # who intentionally stops the stack for maintenance should not have it
    # silently come back underneath them.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ioc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ioc}
      POSTGRES_DB: ${POSTGRES_DB:-ioc_intel}
    ports:
      # Bound to loopback only -- confirmed live that the default
      # "0.0.0.0:5433:5432" form (Docker's shorthand for "publish on every
      # host interface") made this reachable from any other device on the
      # same LAN/WiFi, fully unauthenticated attempts aside (the app's own
      # DATABASE_URL always talks to `postgres` over the internal Docker
      # network below, completely independent of this host port mapping --
      # this only controls HOST-side reachability, e.g. a developer running
      # `psql` locally, and never needed to be network-wide).
      - "127.0.0.1:${HOST_PORT_POSTGRES:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Real gap fixed: confirmed live that Redis previously had no volume at
    # all -- every recreation (an image update, `docker compose up --build`
    # during a reconfigure) silently reset it to empty. Nothing here is a
    # system of record (provider-result cache, rate-limiter counters, the
    # Celery broker/result backend for the one lightweight periodic crawl
    # task), so losing it is never data-loss in the disaster-recovery sense
    # -- but a reconfigure-triggered reset of every rate limiter and the
    # whole provider cache on an otherwise-routine config change is still a
    # real, avoidable behavior change. Redis's own default save schedule
    # (900s/1 key, 300s/10 keys, 60s/10000 keys) is enough for this --
    # nothing here needs AOF-grade durability.
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--save", "60", "10000"]
    volumes:
      - redis_data:/data
    ports:
      # Loopback-only -- see the postgres service's port comment above for
      # why (same LAN-exposure issue, same fix, same reasoning).
      - "127.0.0.1:${HOST_PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      # Loopback-only -- see the postgres service's port comment above. Neo4j
      # itself is password-protected (NEO4J_AUTH below), but confirmed live
      # that its root HTTP endpoint (server/version metadata) answered with
      # zero authentication from another machine on the same LAN -- no
      # datastore should be network-reachable at all when only this host
      # ever needs to talk to it.
      - "127.0.0.1:${HOST_PORT_NEO4J_HTTP:-7475}:7474"
      - "127.0.0.1:${HOST_PORT_NEO4J_BOLT:-7688}:7687"
    volumes:
      - neo4j_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    logging: *default-logging
    # 1g container ceiling against a 512m JVM heap -- gives the JVM's own
    # off-heap/native overhead (direct buffers, thread stacks, mmap'd
    # segments) real room; a container limit equal to -Xmx alone routinely
    # OOM-kills a JVM under normal operation.
    mem_limit: 1g
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      # Loopback-only -- see the postgres service's port comment above.
      # OpenSearch's security plugin is explicitly disabled below (no auth
      # at all), so this was the most exposed of the four datastores:
      # confirmed live that the full REST API was reachable and answering
      # from another machine on the same LAN with zero credentials.
      - "127.0.0.1:${HOST_PORT_OPENSEARCH:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  backend:
    build:
      context: ./backend
    logging: *default-logging
    # Highest of any service on purpose: this process also spawns real
    # nmap subprocesses (backend/app/security_assessment/nmap_tool.py) on
    # top of its own normal Python/AI-client footprint, and a burst of
    # concurrent security-assessment runs is exactly the scenario this
    # limit exists to contain (paired with the new concurrency cap on
    # concurrent scans in security_assessment.py, a belt-and-suspenders
    # pair -- the cap bounds how many can run at once, this limits the
    # damage if that cap is ever raised or a single run is unusually heavy).
    # Bumped 2g -> 4g for the Metasploit Framework install + its own
    # msfrpcd daemon (started below) -- a full Ruby-based exploit
    # framework's module cache and RPC server add real memory footprint on
    # top of everything already listed above.
    mem_limit: 4g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ioc}:${POSTGRES_PASSWORD:-ioc}@postgres:5432/${POSTGRES_DB:-ioc_intel}
      # Metasploit RPC daemon credentials -- msfrpcd (started below, bound to
      # 127.0.0.1 only) is reachable from nowhere but this container's own
      # backend process, so exposure risk from a guessable default is low,
      # but still overridable via .env like every other credential here.
      MSF_RPC_PASSWORD: ${MSF_RPC_PASSWORD:-horizon-grid-msf-rpc-local}
      # app-backend is the ONLY process that serves concurrent user-facing HTTP
      # traffic (celery_worker/celery_beat below deliberately do NOT set these,
      # falling back to config.py's much smaller defaults -- see that file's
      # own comment on db_pool_size/db_pool_max_overflow for the full
      # rationale, including why every authenticated request already costs 2
      # connections, not 1). 30+20=50 here + 5+5=10 each for the two celery
      # processes = 70 total worst-case, comfortably under Postgres's default
      # max_connections=100.
      DB_POOL_SIZE: "30"
      DB_POOL_MAX_OVERFLOW: "20"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NEO4J_URI: bolt://neo4j:7687
      OPENSEARCH_URL: http://opensearch:9200
      # Points at the native (non-Docker) Ollama install on the host --
      # gemma4:26b's ~16GB mmap load is dramatically slower through Docker
      # Desktop's WSL2 volume-mount layer (never finished loading in 5+ min
      # in a containerized Ollama) than direct NTFS access (~1s load,
      # confirmed via native Ollama). host.docker.internal resolves to the
      # host machine from inside this container (Docker Desktop Windows/Mac).
      #
      # Was hardcoded here rather than using the ${VAR:-default} substitution
      # every other setting in this file uses -- confirmed live that this
      # silently overrode the real OLLAMA_BASE_URL written to .env by the
      # setup wizard, since a compose `environment:` entry always wins over
      # `env_file:` regardless of what's actually in .env. Any user pointing
      # Ollama at a different host/port (e.g. a machine other than
      # localhost) had that setting written correctly but never honored.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # host.docker.internal is a Docker Desktop (Windows/Mac) special DNS
    # entry -- it does NOT resolve on native Linux Docker Engine (confirmed
    # live: a real install on Ubuntu 24.04 via linux/build-deb.sh's own
    # package, with a native host Ollama, failed to reach it) unless the
    # daemon is explicitly told to map it, which Compose has supported since
    # Docker Engine 20.10 via the special "host-gateway" value. Harmless and
    # redundant on Docker Desktop, where it already resolves natively.
    #
    # "host-gateway" alone is NOT enough under WSL2 + native docker-ce
    # (i.e. `docker compose` running against dockerd installed via
    # get.docker.com *inside* a WSL2 distro, as opposed to Docker Desktop's
    # own WSL2 integration) -- confirmed live: from dockerd's point of view
    # in that setup, "the host" is the WSL2 VM itself, one hop short of the
    # real Windows machine where a host-run Ollama actually listens.
    # "host-gateway" there resolves to the WSL VM's own docker bridge
    # gateway (172.17.0.1 in the live repro), where nothing is listening,
    # not the WSL VM's default-route gateway (172.30.192.1 in the same
    # repro, i.e. `ip route`'s "default via ..." target) that actually
    # reaches the outer Windows host. HOST_GATEWAY_TARGET lets a caller
    # that has detected this specific WSL2 case (see
    # linux/scripts/common.sh's hg_detect_host_gateway_override and
    # linux/wizard/setup_wizard.py's _detect_host_gateway_override) override
    # just the right-hand side with that real gateway IP; every other
    # caller never sets it, so this is unchanged from plain "host-gateway"
    # on Docker Desktop and on bare-metal Linux docker-ce (no WSL hop, so
    # the docker bridge gateway IS a real interface on the literal host).
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_TARGET:-host-gateway}"
    ports:
      - "${HOST_PORT_BACKEND:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hits /health/detailed (real Postgres/Redis check), not plain /health
    # (which is deliberately dependency-free -- see main.py's own comment).
    # start_period gives alembic upgrade head + uvicorn startup real time
    # before the first failure counts against retries.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/detailed"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Bumped 30s -> 60s: msfrpcd (started below) now also needs to come up
      # before this container is "ready" in any meaningful sense, even
      # though /health/detailed itself never checks it directly.
      start_period: 60s
    volumes:
      - ./backend:/app
    command: >
      sh -c "msfrpcd -f -P \"$$MSF_RPC_PASSWORD\" -S -a 127.0.0.1 -p 55553 -U msf &
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    logging: *default-logging
    mem_limit: 1g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ioc}:${POSTGRES_PASSWORD:-ioc}@postgres:5432/${POSTGRES_DB:-ioc_intel}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    # See the backend service's own comment above -- same native-Linux
    # host.docker.internal gap (and the same WSL2 HOST_GATEWAY_TARGET
    # override), added here too since this process can also run
    # AI-calling background jobs (scheduled OSINT/reanalysis).
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_TARGET:-host-gateway}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
    logging: *default-logging
    mem_limit: 512m
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    # See the backend service's own comment above -- same WSL2
    # HOST_GATEWAY_TARGET override applies here too.
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_TARGET:-host-gateway}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    logging: *default-logging
    mem_limit: 1g
    environment:
      # Left empty by default so the frontend auto-detects its own origin
      # (see frontend/lib/api.ts's getApiUrl()) -- only set PUBLIC_API_URL
      # for a reverse-proxy or other non-default setup. Hyphen-only form
      # (not ${VAR:-default}) so an explicitly-empty value stays empty
      # instead of falling back to a hardcoded default.
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL-}
      NEXT_PUBLIC_BACKEND_PORT: ${HOST_PORT_BACKEND:-8000}
    ports:
      - "${HOST_PORT_FRONTEND:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  opensearch_data:
