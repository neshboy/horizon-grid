# Translation of docker-compose `celery_beat` service: same backend image,
# runs the Celery beat scheduler. Kept at a single replica intentionally --
# celery beat is a singleton scheduler and running more than one replica
# would produce duplicate scheduled task dispatches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: ioc-intel-platform
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ioc-intel-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - "celery"
            - "-A"
            - "app.workers.celery_app"
            - "beat"
            - "--loglevel=info"
          envFrom:
            - configMapRef:
                name: ioc-intel-config
            - secretRef:
                name: ioc-intel-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
