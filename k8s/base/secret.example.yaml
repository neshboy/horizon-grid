# -----------------------------------------------------------------------------
# EXAMPLE ONLY -- placeholder values, safe to commit.
#
# This file exists to document the *shape* of the real Secret (which env vars
# it must contain) and is deliberately named `secret.example.yaml` -- it is
# NOT referenced by kustomization.yaml and must NOT be applied as-is.
#
# To create the real Secret from your local .env file, see k8s/README.md,
# e.g.:
#   kubectl create secret generic ioc-intel-secrets \
#     --namespace ioc-intel-platform \
#     --from-env-file=.env
#
# The keys below mirror .env.example / docker-compose.yml exactly.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ioc-intel-secrets
  namespace: ioc-intel-platform
type: Opaque
stringData:
  # --- Postgres credentials (docker-compose `postgres` service env) ---
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  # Full connection string as consumed by the backend/celery Settings
  # (postgresql+asyncpg://ioc:ioc@postgres:5432/ioc_intel in docker-compose);
  # kept whole here because it embeds the password above.
  DATABASE_URL: ""

  # --- Neo4j credentials (docker-compose NEO4J_AUTH: neo4j/changeme-neo4j) ---
  NEO4J_USER: ""
  NEO4J_PASSWORD: ""

  # --- Security ---
  JWT_SECRET_KEY: ""
  # Independent key for encrypting runtime-configured provider/AI credentials
  # at rest (app/core/crypto.py). If left blank, the app derives it from
  # JWT_SECRET_KEY instead -- set your own so the two secrets can be rotated
  # independently later without orphaning already-saved credentials.
  ENCRYPTION_MASTER_KEY: ""

  # --- Metasploit RPC (Pentest Suite gated exploit-validation feature) ---
  # msfrpcd binds to 127.0.0.1 only inside the backend container, so this is
  # unreachable from outside it regardless, but the backend still requires it.
  MSF_RPC_PASSWORD: ""

  # --- AWS Bedrock (Claude) ---
  # BEDROCK_API_KEY is a bearer token from IAM -> Users -> Security
  # credentials -> "Generate API Key" (preferred). AWS_ACCESS_KEY_ID/SECRET
  # are the older SigV4 fallback, only used if BEDROCK_API_KEY is blank.
  BEDROCK_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  # --- Google Gemini (alternative AI backend, set AI_BACKEND=gemini) ---
  GEMINI_API_KEY: ""

  # --- Anthropic direct API (alternative AI backend, set AI_BACKEND=anthropic) ---
  ANTHROPIC_API_KEY: ""

  # --- Groq (alternative AI backend, set AI_BACKEND=groq) ---
  GROQ_API_KEY: ""

  # --- OpenAI / ChatGPT (alternative AI backend, set AI_BACKEND=openai) ---
  OPENAI_API_KEY: ""

  # --- Kimi / Moonshot AI (alternative AI backend, set AI_BACKEND=kimi) ---
  KIMI_API_KEY: ""

  # --- DeepSeek (alternative AI backend, set AI_BACKEND=deepseek) ---
  DEEPSEEK_API_KEY: ""

  # --- xAI / Grok (alternative AI backend, set AI_BACKEND=xai) ---
  XAI_API_KEY: ""

  # --- Mistral AI (alternative AI backend, set AI_BACKEND=mistral) ---
  MISTRAL_API_KEY: ""

  # --- OpenRouter (alternative AI backend, set AI_BACKEND=openrouter) ---
  OPENROUTER_API_KEY: ""

  # --- Free-tier providers (real connectors) ---
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  OTX_API_KEY: ""
  NVD_API_KEY: ""
  ABUSECH_AUTH_KEY: ""

  # --- Paid providers (stub connectors -- add key to activate) ---
  HYBRID_ANALYSIS_API_KEY: ""
  CENSYS_PERSONAL_ACCESS_TOKEN: ""
  CENSYS_ORGANIZATION_ID: ""
  PHISHTANK_API_KEY: ""
