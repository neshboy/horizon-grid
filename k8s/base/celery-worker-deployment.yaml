# Translation of docker-compose `celery_worker` service: same backend image,
# runs the Celery worker instead of uvicorn.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ioc-intel-platform
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ioc-intel-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - "celery"
            - "-A"
            - "app.workers.celery_app"
            - "worker"
            - "--loglevel=info"
          envFrom:
            - configMapRef:
                name: ioc-intel-config
            - secretRef:
                name: ioc-intel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
