# Translation of docker-compose `backend` service. In docker-compose the
# container runs `alembic upgrade head && uvicorn ... --reload`; in k8s the
# --reload flag (dev-only, relies on the bind-mounted ./backend volume) is
# dropped since there's no source bind-mount here, but the alembic migration
# step is kept so the Deployment is self-sufficient on rollout.
#
# Config split:
#   - envFrom configMapRef: non-secret host/port/URL structure
#   - envFrom secretRef:    DATABASE_URL, JWT/AWS/provider API keys, passwords
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ioc-intel-platform
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ioc-intel-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ioc-intel-config
            - secretRef:
                name: ioc-intel-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ioc-intel-platform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
