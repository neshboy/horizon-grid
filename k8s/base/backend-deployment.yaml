# Translation of docker-compose `backend` service. In docker-compose the
# container runs `alembic upgrade head && uvicorn ... --reload`; in k8s the
# --reload flag (dev-only, relies on the bind-mounted ./backend volume) is
# dropped since there's no source bind-mount here.
#
# Real gaps found live during a full-codebase audit, all fixed here:
#   1. alembic upgrade head used to run inline in every replica's own
#      startup command -- with replicas: 2, both pods could run it
#      CONCURRENTLY against the same database on a simultaneous rollout/
#      scale-up. Alembic has no built-in distributed lock, so this is a
#      real race, not just a redundant no-op. Moved to a separate, single-
#      run Job (backend-migrate below) that should be applied and awaited
#      BEFORE this Deployment; the Deployment's own containers now only
#      run uvicorn (and msfrpcd, see gap 3).
#   2. imagePullPolicy: IfNotPresent combined with the floating :latest tag
#      meant a node that already had ANY image cached under that tag would
#      never re-pull after a new :latest was pushed -- silently pinning
#      stale code per-node indefinitely. Changed to Always.
#   3. msfrpcd (the real Metasploit RPC daemon docker-compose.yml starts
#      alongside the backend, needed for Exploit Validation) was never
#      started here at all -- added to the container command.
#   4. DB_POOL_SIZE/DB_POOL_MAX_OVERFLOW (docker-compose.yml: "30"/"20",
#      backend-ONLY -- celery_worker/celery_beat deliberately keep
#      config.py's smaller defaults so the total stays under Postgres's
#      max_connections=100) were dropped in translation -- added directly
#      on this container, not the shared ConfigMap (which celery's own
#      Deployments also read from).
#   5. Both probes hit the dependency-free /health, which returns 200
#      unconditionally even with Postgres/Redis fully down (confirmed live
#      -- see linux/scripts/common.sh's own identical comment) -- so a
#      backend pod that can't reach either dependency was still reported
#      ready/alive, and would never be restarted or pulled from rotation.
#      Changed both to /health/detailed, which genuinely checks them.
#   6. Memory limit was 1Gi -- docker-compose.yml documents backend at 4g,
#      specifically for the Metasploit Framework install + msfrpcd's own
#      footprint on top of the normal Python/AI-client usage. Matched here.
#
# Also mirrors docker-compose.yml's msfrpcd startup: backend/app/pentest/
# msf_client.py's MsfRpcClient (config.py's msf_rpc_host default) always
# talks to 127.0.0.1:55553, i.e. it expects msfrpcd running in this same
# container/pod, not a separate Service -- so msfrpcd must be started here
# too, exactly like docker-compose.yml's backend command does, or every
# Pentest Suite exploit-validation call fails with "msfrpcd unreachable"
# even though MSF_RPC_PASSWORD (see secret.example.yaml) is configured and
# the image has the full Metasploit Framework installed to back this.
#
# Config split:
#   - envFrom configMapRef: non-secret host/port/URL structure
#   - envFrom secretRef:    DATABASE_URL, JWT/AWS/provider API keys, passwords
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: ioc-intel-platform
  labels:
    app: backend-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ioc-intel-platform/backend:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ioc-intel-config
            - secretRef:
                name: ioc-intel-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ioc-intel-platform
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Apply and wait for the backend-migrate Job above to complete before
      # applying this Deployment (e.g. `kubectl apply -f backend-deployment.yaml
      # -l app=backend-migrate && kubectl wait --for=condition=complete
      # job/backend-migrate -n ioc-intel-platform` in a rollout script) --
      # this Deployment's own pods no longer run migrations themselves.
      containers:
        - name: backend
          image: ioc-intel-platform/backend:latest
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            # No inline "alembic upgrade head &&" here (unlike docker-compose.yml's
            # single-container command) -- see gap 1 above: with replicas: 2, running
            # it in every pod's own startup risks a concurrent-migration race.
            # Migrations run exactly once via the separate backend-migrate Job above.
            - "msfrpcd -f -P \"$(MSF_RPC_PASSWORD)\" -S -a 127.0.0.1 -p 55553 -U msf & uvicorn app.main:app --host 0.0.0.0 --port 8000"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ioc-intel-config
            - secretRef:
                name: ioc-intel-secrets
          # app-backend is the ONLY workload here that serves concurrent
          # user-facing HTTP traffic (celery-worker/celery-beat deliberately
          # do NOT set these, falling back to backend/app/core/config.py's
          # much smaller defaults -- see that file's own comment on
          # db_pool_size/db_pool_max_overflow for the full rationale,
          # including why every authenticated request already costs 2
          # connections, not 1). Mirrors docker-compose.yml's backend-only
          # DB_POOL_SIZE/DB_POOL_MAX_OVERFLOW override exactly -- set here
          # (rather than in the shared ConfigMap, which envFrom above wires
          # into celery-worker/celery-beat identically) so those two
          # lightweight, DB-light processes aren't also bumped to this much
          # larger pool. A directly-listed `env:` entry takes precedence over
          # the same key coming from `envFrom` above.
          env:
            - name: DB_POOL_SIZE
              value: "30"
            - name: DB_POOL_MAX_OVERFLOW
              value: "20"
            # backend/app/core/security_assessment.py's platform-wide
            # concurrent-scan cap (SECURITY_ASSESSMENT_MAX_CONCURRENT_SCANS,
            # config.py default 4) is an in-process asyncio.Semaphore built
            # once per backend process -- it does NOT coordinate across
            # pods. This Deployment's `replicas: 2` above means, left at the
            # default, each of the 2 pods would enforce its own independent
            # 4-scan cap, silently doubling the real platform-wide ceiling to
            # 8 concurrent scans/nmap subprocesses versus the 4 every other
            # deployment path (docker-compose.yml, the Windows/Linux
            # installers -- all single-container) actually enforces, and
            # undermining the 4g mem_limit that cap is deliberately paired
            # with there (see docker-compose.yml's backend service comment).
            # 2 per pod x 2 replicas = 4 platform-wide, matching that
            # intended ceiling. Mirrors the DB_POOL_SIZE/DB_POOL_MAX_OVERFLOW
            # backend-only override just above -- if `replicas:` above ever
            # changes, recompute this value to keep the product at 4 (or
            # whatever the re-tuned platform-wide ceiling should be).
            - name: SECURITY_ASSESSMENT_MAX_CONCURRENT_SCANS
              value: "2"
          # Hits /health/detailed (real Postgres/Redis check), not plain
          # /health (which is deliberately dependency-free -- see
          # backend/app/main.py's own comment on GET /health). Mirrors
          # docker-compose.yml's backend healthcheck: and the Windows/Linux
          # watchdog scripts, all of which point at /health/detailed for the
          # same reason -- plain /health still returns 200 even with
          # Postgres fully stopped, so it can never take a DB-broken pod out
          # of the Service's endpoint list.
          readinessProbe:
            httpGet:
              path: /health/detailed
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/detailed
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ioc-intel-platform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
