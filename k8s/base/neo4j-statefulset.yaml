# Translation of docker-compose `neo4j` service (neo4j:5-community), with the
# apoc plugin and NEO4J_AUTH from docker-compose (there: neo4j/changeme-neo4j).
# NEO4J_AUTH is derived from Secret values at container start via `command`
# since NEO4J_AUTH must be a single "user/password" string.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: ioc-intel-platform
  labels:
    app: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          command:
            - "sh"
            - "-c"
            - 'export NEO4J_AUTH="$NEO4J_USER/$NEO4J_PASSWORD" && exec /startup/docker-entrypoint.sh neo4j'
          env:
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: ioc-intel-secrets
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ioc-intel-secrets
                  key: NEO4J_PASSWORD
            - name: NEO4J_PLUGINS
              valueFrom:
                configMapKeyRef:
                  name: ioc-intel-config
                  key: NEO4J_PLUGINS
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ioc-intel-platform
  labels:
    app: neo4j
spec:
  clusterIP: None
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
