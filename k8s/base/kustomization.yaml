apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ioc-intel-platform

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.example.yaml is intentionally NOT listed here -- it's a
  # placeholder/documentation file only. Create the real
  # `ioc-intel-secrets` Secret yourself (see ../README.md) before applying
  # this kustomization.
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - neo4j-statefulset.yaml
  - opensearch-statefulset.yaml
  - backend-deployment.yaml
  - celery-worker-deployment.yaml
  - celery-beat-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: ioc-intel-platform
    includeSelectors: false
