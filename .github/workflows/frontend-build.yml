name: Frontend Build

# Least-privilege: read-only, this job never pushes or modifies the repo.
permissions:
  contents: read

# Runs lint + test + build on changes under frontend/**.
#
# A real vitest suite now exists (5 files, 30 tests, under frontend/lib and
# frontend/app/pentest -- see vitest.config.ts), so "npm test" is invoked as
# a real regression check, not skipped.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
